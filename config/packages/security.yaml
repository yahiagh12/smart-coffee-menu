security:
  # encoders / password hashers
  password_hashers:
    App\Entity\User: 'auto'

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      provider: app_user_provider
      lazy: true
      form_login:
        login_path: /login
        check_path: /login
        default_target_path: /
        enable_csrf: true
        success_handler: App\Security\LoginSuccessHandler
      logout:
        path: /auth/logout
        target: /login
        invalidate_session: true
        csrf_token_id: logout
      remember_me:
        secret: '%kernel.secret%'
        lifetime: 604800
        path: /
        secure: auto
        httponly: true
        samesite: strict

  access_control:
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/auth/register, roles: PUBLIC_ACCESS }
    - { path: ^/api/orders, roles: ROLE_CLIENT }
    - { path: ^/admin, roles: ROLE_ADMIN }
    - { path: ^/client, roles: ROLE_CLIENT }
    - { path: ^/traiteur, roles: ROLE_TRAITEUR }
