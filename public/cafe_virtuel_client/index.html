<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Café Virtuel - Aperçu Client</title>
    <style>
        /* minimal styles copied from the twig preview to keep the look */
        * { margin:0; padding:0; box-sizing:border-box; }
        body{ font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg,#1a1a2e 0%, #16213e 100%); color:#333; }
        .header{ background: linear-gradient(135deg,#8B4513 0%, #A0522D 100%); color:#fff; padding:20px; text-align:center; box-shadow:0 4px 6px rgba(0,0,0,0.3); position:sticky; top:0; z-index:100; }
        .header-top{ max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; }
        .nav{ display:flex; justify-content:center; gap:20px; margin-top:15px; flex-wrap:wrap; }
        .nav button{ background:rgba(255,255,255,0.2); color:white; border:2px solid white; padding:10px 20px; border-radius:25px; cursor:pointer; }
        .nav button.active, .nav button:hover{ background:white; color:#8B4513; }
        .container{ max-width:1200px; margin:0 auto; padding:40px 20px; }
        .client-main{ display:grid; grid-template-columns:1fr 300px; gap:20px; }
        .section{ background:white; border-radius:15px; padding:30px; box-shadow:0 8px 16px rgba(0,0,0,0.2); }
        .menu-grid{ display:grid; grid-template-columns: repeat(auto-fill,minmax(250px,1fr)); gap:20px; margin-top:20px; }
        .menu-item{ background: linear-gradient(135deg,#fff5f1 0%, #ffe4d6 100%); border-left:5px solid #8B4513; padding:20px; border-radius:10px; }
        .menu-item h3{ color:#8B4513; margin-bottom:10px; }
        .menu-item .description{ color:#666; font-size:0.9em; margin-bottom:10px; }
        .menu-item .price{ color:#D2691E; font-weight:bold; font-size:1.2em; margin-bottom:10px; }
        .menu-item-footer{ display:flex; gap:10px; align-items:center; }
        .sidebar .cart-card{ position:sticky; top:100px; }
        .card{ background:#fff; padding:12px; border-radius:8px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div>
                <h1>☕ Café Virtuel (Aperçu)</h1>
                <p>Preview des templates — les listes admin s'affichent ici automatiquement.</p>
            </div>
            <div style="display:flex; gap:10px;">
                <a href="/" style="color:#fff; text-decoration:none;">Accueil</a>
            </div>
        </div>
        <div class="nav">
            <button type="button" onclick="showSection('menu')" class="active">Menu</button>
            <button type="button" onclick="showSection('about')">À Propos</button>
            <button type="button" onclick="showSection('contact')">Contact</button>
        </div>
    </div>
